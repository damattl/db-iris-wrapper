# Production overrides. Use with:
#   make prod
#   (= docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --build)
# Required env (e.g. in .env next to this file): DOMAIN, POSTGRES_PASSWORD
services:
    server:
        build:
            args:
                VITE_API_BASE_URL: "https://${DOMAIN:?DOMAIN is required}/v1"
        # environment:
        #     SINGLE_STATION: AH # uncomment to restrict the import to one station
        networks:
            - default
            - traefik
        labels:
            - traefik.enable=true
            - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-proxy}
            - traefik.http.routers.iris-wrapper.rule=Host(`${DOMAIN}`)
            - traefik.http.routers.iris-wrapper.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
            - traefik.http.routers.iris-wrapper.tls=true
            - traefik.http.routers.iris-wrapper.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le-http}
            # - traefik.http.routers.iris-wrapper.middlewares=demo-auth@file
            - traefik.http.services.iris-wrapper.loadbalancer.server.port=8000

volumes:
    postgres_data:
        name: db-iris-wrapper.postgres_data.prod

networks:
    traefik:
        name: ${TRAEFIK_NETWORK:-traefik-proxy}
        external: true
