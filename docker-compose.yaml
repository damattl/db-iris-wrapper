# Shared, environment agnostic base. Combine with an environment override:
#   make dev   (docker-compose.dev.yaml)
#   make prod  (docker-compose.prod.yaml)
# Required env: POSTGRES_PASSWORD
name: db-iris-wrapper
services:
    db:
        image: postgres
        restart: unless-stopped
        # set shared memory limit when using docker-compose
        shm_size: 128mb
        environment:
            POSTGRES_USER: "user"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    server:
        build:
            context: .
        restart: unless-stopped
        shm_size: 128mb
        environment:
            RUST_LOG: "${RUST_LOG:-info}"
            DATABASE_URL: "postgres://user:${POSTGRES_PASSWORD}@database:5432/iris_wrapper"
        links:
            - "db:database"
        depends_on:
            - db

volumes:
    postgres_data:
