# Shared, environment agnostic base. Combine with an environment override:
#   make dev   (docker-compose.dev.yaml)
#   make prod  (docker-compose.prod.yaml)
# Required env: POSTGRES_PASSWORD
name: db-iris-wrapper
services:
    db:
        image: postgres:18
        restart: unless-stopped
        # set shared memory limit when using docker-compose
        shm_size: 128mb
        environment:
            POSTGRES_USER: "user"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
            POSTGRES_DB: "iris_wrapper"
        volumes:
            # postgres 18+ keeps its data in a versioned subdirectory of /var/lib/postgresql
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U user -d iris_wrapper"]
            interval: 5s
            timeout: 5s
            retries: 10

    server:
        build:
            context: .
        restart: unless-stopped
        shm_size: 128mb
        environment:
            RUST_LOG: "${RUST_LOG:-info}"
            DATABASE_URL: "postgres://user:${POSTGRES_PASSWORD}@db:5432/iris_wrapper"
        depends_on:
            db:
                condition: service_healthy

volumes:
    postgres_data:
